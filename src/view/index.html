<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Formulário</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
  <h1>Tarefa</h1>
  <a href="create.html">Criar um novo formulário</a>

  <h2>GET</h2>
  <label>Retornar todas as tarefas</label>
  <form action="/tasks" method="GET">
    <button type="submit">Retornas todas as tarefas</button>
  </form>

  <label>Retornar as tarefas completas</label>
  <form action="/tasks/completed" method="GET">
    <button type="submit">Ver tarefas completas</button>
  </form>

  <label>Buscar por ID</label>
  <form action="/tasks/task" method="GET">
    ID <input name="id">
    <button type="submit">Buscar por ID</button>
  </form>

  <script src="https://jsdelivr.net" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
